# Manifest för Flathub: bygger LuxCanvas från en tagg på GitHub.
# Läggs i repot flathub/io.github.dio99.LuxCanvas tillsammans med
# cargo-sources.json (se SUBMIT.md). Vid ny version: uppdatera tag och commit,
# och kör packaging/flatpak/cargo-sources.py om Cargo.lock ändrats.
id: io.github.dio99.LuxCanvas
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: luxcanvas
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU, webbkameror (V4L2) och MIDI-enheter.
  - --device=all
  # OSC och nätverksströmmar.
  - --share=network
  - --socket=pulseaudio
  # Projekt pekar på media bredvid sig; filväljarens portal ger bara åtkomst
  # till den valda filen. De vanliga mediemapparna och USB-minnen räcker för
  # de flesta; mer kan ges med `flatpak override` (se README).
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=/media
  - --filesystem=/run/media
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/luxcanvas/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: luxcanvas
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/luxcanvas /app/bin/luxcanvas
      - install -Dm644 packaging/linux/io.github.dio99.LuxCanvas.desktop /app/share/applications/io.github.dio99.LuxCanvas.desktop
      - install -Dm644 packaging/linux/io.github.dio99.LuxCanvas.svg /app/share/icons/hicolor/scalable/apps/io.github.dio99.LuxCanvas.svg
      - install -Dm644 packaging/linux/io.github.dio99.LuxCanvas.metainfo.xml /app/share/metainfo/io.github.dio99.LuxCanvas.metainfo.xml
      - install -Dm644 packaging/linux/io.github.dio99.LuxCanvas.mime.xml /app/share/mime/packages/io.github.dio99.LuxCanvas.xml
      - mkdir -p /app/share/luxcanvas && cp -r examples /app/share/luxcanvas/
    sources:
      - type: git
        url: https://github.com/dio99/luxcanvas.git
        tag: v1.6.2
        commit: 1aa6a8c826fd6b661b79cfceff4614a70c46ef16
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
