[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.6.2"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["Anders Larsson"]
repository = "https://github.com/dio99/luxcanvas"
homepage = "https://github.com/dio99/luxcanvas"

[workspace.dependencies]
lc-core = { path = "crates/lc-core" }
lc-geom = { path = "crates/lc-geom" }
lc-media = { path = "crates/lc-media" }
lc-render = { path = "crates/lc-render" }
lc-control = { path = "crates/lc-control" }
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.36"
egui = { version = "0.36", default-features = false }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
qrcode = { version = "0.14", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[profile.dev.package."*"]
opt-level = 2
