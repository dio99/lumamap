[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
lm-core = { path = "crates/lm-core" }
lm-geom = { path = "crates/lm-geom" }
lm-media = { path = "crates/lm-media" }
lm-render = { path = "crates/lm-render" }
lm-control = { path = "crates/lm-control" }
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.36"
egui = { version = "0.36", default-features = false }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
rfd = "0.17"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2
